<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    div {
      width: 240px;
      height: 150px;
      margin: 15px;
      float: left;
      background-color: #f0f0f0;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1 style="text-align: center; font-family: sans-serif;">Блоки, рамки та фони</h1>
  <div style="border: 4px solid #007bff;">Solid border</div>
  <div style="border: 4px dashed #dc3545;">Dashed border</div>
  <div style="border: 4px dotted #28a745;">Dotted border</div>
  <div style="border: 6px double #6f42c1;">Double border</div>
  <div style="border: 6px groove #fd7e14;">Groove border</div>
  <div style="border: 2px solid black; border-radius: 20px;">Закруглені кути</div>
  <div style="width: 150px; height: 150px; border-radius: 50%; background-image: url('https://picsum.photos/id/1025/200/200'); background-size: cover; color: white; text-shadow: 1px 1px 2px black;">Круглий блок (50%)</div>
  <div style="border: 2px solid #e83e8c; border-radius: 35px 0px 35px 0px;">Асиметричні кути</div>
  <div style="box-shadow: 0px 10px 20px gray;">М'яка тінь</div>
  <div style="box-shadow: 6px 6px 0px black;">Чітка 3D-тінь</div>
  <div style="box-shadow: inset 0px 0px 15px black;">Внутрішня тінь</div>
  <div style="box-shadow: 0px 0px 15px #00d2ff; border: 1px solid #00d2ff;">Сяюча тінь</div>
  <div style="border: 10px solid transparent; border-image: linear-gradient(to right, red, yellow, blue) 1;">Border-image градієнт</div>
  <div style="border: 10px solid transparent; border-image: repeating-linear-gradient(45deg, black, black 10px, yellow 10px, yellow 20px) 10;">візерунок</div>
  <div style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(255,0,128,0.5)), url('https://picsum.photos/id/1018/400/300'); background-size: cover; color: white;">Градієнт поверх фото</div>
  <div style="background-image: radial-gradient(circle, transparent 30%, black 90%), url('https://picsum.photos/id/1015/400/300'); background-size: cover; color: white;">Кілька фонових шарів</div>

</body>
</html>
