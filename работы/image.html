<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ми вивчаємо зображення</title>
    <style>
        body{
            background-image: url("https://images.hitpaw.com/topics/gif-tips/duck-transparent-gif.gif");
            background-size: 200px;
            background-repeat: no-repeat;
            background-position: 100% 100%;
            background-attachment: fixed;
        }
        p{
            font-size: 1in;
            color: navajowhite;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6mHAun_fMCD5H_X1ke4mjEBbhVz8-ZoMRV8YsQ1ikvw&s=10");
            background-size: cover;
        }
        div{
            width: 500px;
            height: 500px;
            margin-bottom: 20px;
        }
        #d1{
            background-image: url("https://www.google.com/imgres?q=background%20image&imgurl=https%3A%2F%2Fimages.unsplash.com%2Fphoto-1497250681960-ef046c08a56e%3Ffm%3Djpg%26q%3D60%26w%3D3000%26auto%3Dformat%26fit%3Dcrop%26ixlib%3Drb-4.1.0%26ixid%3DM3wxMjA3fDB8MHxzZWFyY2h8Mnx8cHJldHR5JTIwYmFja2dyb3VuZHxlbnwwfHwwfHx8MA%253D%253D&imgrefurl=https%3A%2F%2Funsplash.com%2Fs%2Fphotos%2Fpretty-background&docid=vyk6olgVmPZEaM&tbnid=hyDtcXQswZbe6M&vet=12ahUKEwiar7Kk9fWWAxXhAhAIHcpFLloQnPAOegUIsAUQAA..i&w=3000&h=4498&hcb=2&ved=2ahUKEwiar7Kk9fWWAxXhAhAIHcpFLloQnPAOegUIsAUQAA");
            background-size: cover;
            border: 30px darkmagenta groove;
          
        } 
        #d2{
            background: linear-gradient(rgba(255,255,0,0,5), rgba(0,0,255,0,5)), url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9vCkDNtL7wL4I_D2nA1ytMFY5mhQ8ss8qAGu92pPvvg&s=10")
            border-width: 50px;
            border-style: solid;
            border-image: linear-gradient(yellow, blue) 30;
        }  
        #img1{
            width: 50%;
            border-radius: 50%;
            box-shadow: 0px 0px 50px slategrey;
        }
        img{
            margin: auto;
            display: flex;
            margin-bottom: 40px;
        } 
        #img2{
            border-width: 30px;
            border-style: solid;
            border-image: linear-gradient(45deg, darkmagenta, pink) 30;
            box-shadow:
            13px 13px purple
            -1em 0 0.4em pink;
        }
           

        
    </style>
</head>
<body>
    <p>Ми are larping картинки</p>
    <div id="d1"></div>
    <div id="d2"></div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6ia7MfFipwPwptEwe_6qU547lBQ5dlmVzsYzVhhmvig&s=10" alt="colored city" id="img1">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqklWJy5wCKgjoCZMaEUtzrXD98bXW8qtzfHZ5SilhPw&s=10" alt="flowers" title="big flower" id="img2">

</html>
